! Cisco IOS Core Switch Configuration
! Vulnerabilities intentionally included for CIS Benchmark evaluation:
! - Telnet enabled on VTY
! - Insecure HTTP server enabled
! - Weak SNMP community "public"
! - Plaintext password without service password-encryption
! - Type-5 and Type-7 secret hashes for redaction testing

hostname Core-Switch-01
enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
enable password cisco123

no service password-encryption

username admin privilege 15 secret 9 $9$K1e5.9...
username operator secret 5 $1$op$q2w3e4r5t6y7u8i9o0p1

ip ssh version 1
ip domain-name enterprise.internal

! Insecure Web Management
ip http server
no ip http secure-server

! Insecure SNMP Management
snmp-server community public RO
snmp-server community private RW
snmp-server host 10.10.10.50 version 2c public

! NTP Configuration without authentication
ntp server 10.0.0.1
no ntp authenticate

! AAA Configuration
no aaa new-model

! Banner MOTD (missing legal warning)
no banner motd

! Interfaces
interface GigabitEthernet0/1
 description Trunk to Distribution Layer
 switchport mode trunk
 no cdp enable
!
interface GigabitEthernet0/2
 description User Workstation Access Port
 switchport mode access
 switchport access vlan 10
 no spanning-tree bpduguard enable
!
line con 0
 exec-timeout 0 0
 password 7 0822455D0A16
 logging synchronous
!
line vty 0 4
 exec-timeout 0 0
 password 7 0822455D0A16
 transport input telnet ssh
!
end
