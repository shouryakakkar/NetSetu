## Juniper Junos Edge Gateway Configuration
## Format: Hierarchical configuration dump

system {
    host-name Edge-Gateway-01;
    domain-name enterprise.internal;
    root-authentication {
        encrypted-password "$5$rounds=10000$g9J5...$p0xG...";
    }
    services {
        ssh {
            protocol-version v2;
        }
        telnet;
        web-management {
            http {
                interface ge-0/0/0.0;
            }
        }
    }
    login {
        message "Unauthorized access is prohibited.";
        user admin {
            uid 2000;
            class super-user;
            authentication {
                encrypted-password "$6$rounds=5000$saltsalt$hashedpass...";
            }
        }
    }
    syslog {
        user * {
            any emergency;
        }
        file messages {
            any notice;
            authorization info;
        }
    }
    ntp {
        server 10.0.0.1;
    }
}
snmp {
    community public {
        authorization read-only;
    }
}
routing-options {
    router-id 10.0.0.1;
    autonomous-system 65001;
}
protocols {
    bgp {
        group external-peers {
            type external;
            peer-as 65002;
            neighbor 192.168.1.2;
        }
    }
}
